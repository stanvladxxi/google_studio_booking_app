/* ================= INVOICE SCANNING (live vision API) =================
   Uploads a photo of a supplier invoice/delivery note, sends it to Claude
   with vision to extract line items, then shows an editable review table
   before anything touches inventory — OCR/extraction is never trusted
   blindly. Same no-key-needed pattern as the nutrition search: works
   inside the Claude artifact, fails gracefully (clear error, no crash,
   no silent fallback since there's no way to "guess" an invoice locally) elsewhere.
================================================================= */
function openInvoiceScanModal(){
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Scan supplier invoice</h3>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:-8px;">Upload a photo of an invoice or delivery note. Claude reads it and extracts line items — you review and match them before anything is added to inventory.</p>
    <div class="field"><input type="file" id="invoiceFile" accept="image/*" onchange="handleInvoiceFile(event)"></div>
    <div id="invoiceStatus" style="font-size:12px;color:var(--ink-soft);margin:10px 0;"></div>
    <div id="invoiceReviewArea"></div>
    <div class="btn-row" style="margin-top:14px;"><button class="btn ghost" onclick="closeModal()">Close</button></div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleInvoiceFile(event){
  const file = event.target.files[0]; if(!file) return;
  const statusEl = document.getElementById('invoiceStatus');
  statusEl.style.color = 'var(--ink-soft)';
  statusEl.textContent = 'Reading invoice…';
  try{
    const base64Data = await fileToBase64(file);
    const prompt = `This image is a supplier invoice or delivery note for food/baking ingredients. Extract every line item you can clearly read. Return ONLY a JSON array, no prose, no markdown fences, in exactly this shape:
[{"name":"item name as written on the invoice","qty":number,"unit":"kg or g or pcs","cost":number}]
Ignore currency symbols — cost is just the numeric total paid for that line. Skip any line where quantity or cost isn't clearly legible rather than guessing.`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content:[
          {type:"image", source:{type:"base64", media_type:file.type||"image/jpeg", data:base64Data}},
          {type:"text", text:prompt},
        ]}],
      }),
    });
    if(!response.ok) throw new Error(`API returned ${response.status}`);
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text);
    const raw = textBlocks.join("\n");
    const clean = raw.replace(/```json|```/g,'').trim();
    const jsonMatch = clean.match(/\[[\s\S]*\]/);
    if(!jsonMatch) throw new Error("Could not find a line-item list in the response");
    const items = JSON.parse(jsonMatch[0]);
    if(!Array.isArray(items) || items.length===0) throw new Error("No line items were extracted");
    statusEl.style.color = 'var(--mint)';
    statusEl.textContent = `✓ Extracted ${items.length} line item${items.length!==1?'s':''} — review and match below before importing.`;
    renderInvoiceReview(items);
  } catch(err){
    statusEl.style.color = 'var(--warn)';
    statusEl.innerHTML = `⚠ Couldn't scan this invoice (${err.message}). Live invoice scanning needs to run inside the Claude artifact — if you're testing this outside that context, that's expected. You can still add stock manually from the Inventory or Builder tabs.`;
  }
}
function guessLibraryMatch(invoiceName){
  const words = String(invoiceName||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  let best=null, bestScore=0;
  LIBRARY.forEach(item=>{
    const itemWords = item.name.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
    const score = words.filter(w=>itemWords.includes(w)).length;
    if(score>bestScore){ bestScore=score; best=item; }
  });
  return bestScore>0 ? best : null;
}
function renderInvoiceReview(items){
  const area = document.getElementById('invoiceReviewArea');
  const options = LIBRARY.map(i=>`<option value="${i.id}">${i.name} (${i.cat})</option>`).join('');
  area.innerHTML = `
    <table class="recipe-table" style="margin-top:10px;">
      <tr><th>On invoice</th><th>Qty</th><th>Unit</th><th>Cost</th><th>Match to ingredient</th></tr>
      ${items.map((it,idx)=>`<tr>
          <td>${it.name||''}</td>
          <td style="text-align:right;"><input type="number" class="gram-input" id="invQty${idx}" value="${it.qty||0}" step="0.01"></td>
          <td><select id="invUnit${idx}"><option value="kg" ${it.unit==='kg'?'selected':''}>kg</option><option value="g" ${it.unit==='g'?'selected':''}>g</option><option value="pcs" ${it.unit==='pcs'?'selected':''}>pcs</option></select></td>
          <td style="text-align:right;"><input type="number" class="gram-input" id="invCost${idx}" value="${it.cost||0}" step="0.001"></td>
          <td><select id="invMatch${idx}"><option value="">— Skip —</option>${options}</select></td>
        </tr>`).join('')}
    </table>
    <div class="btn-row" style="margin-top:12px;"><button class="btn primary" onclick="confirmInvoiceImport(${items.length})">Add matched rows to inventory</button></div>
    <div id="invoiceImportResult" style="font-size:12px;color:var(--mint);margin-top:8px;"></div>
  `;
  items.forEach((it,idx)=>{
    const guess = guessLibraryMatch(it.name);
    if(guess) document.getElementById(`invMatch${idx}`).value = guess.id;
  });
}
function confirmInvoiceImport(count){
  let added = 0, skipped = 0;
  for(let idx=0; idx<count; idx++){
    const matchId = document.getElementById(`invMatch${idx}`).value;
    if(!matchId){ skipped++; continue; }
    const item = getItem(matchId); if(!item){ skipped++; continue; }
    const qty = parseFloat(document.getElementById(`invQty${idx}`).value)||0;
    const unit = document.getElementById(`invUnit${idx}`).value;
    const cost = parseFloat(document.getElementById(`invCost${idx}`).value)||0;
    if(qty<=0){ skipped++; continue; }
    let stockQty = qty;
    if(item.costUnit!=='piece' && item.costUnit!=='unit' && item.costUnit!=='roll' && unit==='kg') stockQty = qty*1000;
    addInventoryStock(matchId, stockQty, `Scanned from invoice: ${qty}${unit} for ${cost}`);
    // also refresh cost basis so the invoice's price becomes the new raw cost, same as any bulk purchase entry
    if(item.costUnit!=='piece' && item.costUnit!=='unit' && item.costUnit!=='roll'){
      const qtyKg = unit==='g' ? qty/1000 : qty;
      if(qtyKg>0){ costOverrides[matchId] = cost/qtyKg; item.bulkQty=qty; item.bulkUnit=unit; item.bulkCost=cost; }
    }
    added++;
  }
  document.getElementById('invoiceImportResult').textContent = `Added ${added} item${added!==1?'s':''} to inventory${skipped?`, skipped ${skipped}`:''}.`;
  renderAll();
}

/* ================= CSV GOODS-RECEIVED IMPORT ================= */
// Log an entire delivery in one file instead of one ingredient at a time.
// Columns: Ingredient, Quantity, Unit (kg/g/pcs), Cost, Supplier. Matches by
// name against the existing library — unmatched rows are reported, never
// silently guessed into a new ingredient with no nutrition data.
function parseCSVSimple(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(line=>{
    const cells = []; let field=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(inQ){ if(c==='"'){ if(line[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
      else { if(c==='"') inQ=true; else if(c===','){cells.push(field);field='';} else field+=c; }
    }
    cells.push(field);
    return cells.map(c=>c.trim());
  });
}
function openGoodsReceivedCSVModal(){
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Import goods received (CSV)</h3>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:-8px;">Log a whole delivery at once. Columns: <b>Ingredient, Quantity, Unit, Cost, Supplier</b> — Unit is kg, g, or pcs. Matches ingredients by name; unmatched rows are reported, not guessed.</p>
    <div class="field"><input type="file" id="grnFile" accept=".csv" onchange="handleGoodsReceivedCSV(event)"></div>
    <div id="grnResult" style="font-size:12px;color:var(--ink-soft);margin:10px 0;"></div>
    <button class="btn ghost btn small" onclick="downloadGoodsReceivedTemplate()">Download blank template</button>
    <div class="btn-row" style="margin-top:14px;"><button class="btn ghost" onclick="closeModal()">Close</button></div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function downloadGoodsReceivedTemplate(){
  const csv = 'Ingredient,Quantity,Unit,Cost,Supplier\nAll-Purpose Flour,50,kg,4.5,Americana\nWhole Eggs (fresh, ~50g each),360,pcs,16.5,Local Market Supplier\n';
  downloadBlob(csv, 'text/csv', 'goods-received-template.csv');
}
function handleGoodsReceivedCSV(event){
  const file = event.target.files[0]; if(!file) return;
  const resultEl = document.getElementById('grnResult');
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const rows = parseCSVSimple(ev.target.result);
      const header = rows[0].map(h=>h.toLowerCase());
      const idx = {name:header.indexOf('ingredient'), qty:header.indexOf('quantity'), unit:header.indexOf('unit'), cost:header.indexOf('cost'), supplier:header.indexOf('supplier')};
      if(idx.name<0 || idx.qty<0){ resultEl.style.color='var(--warn)'; resultEl.textContent='CSV needs at least "Ingredient" and "Quantity" columns.'; return; }
      let received=0, unmatched=[];
      rows.slice(1).forEach(row=>{
        if(!row[idx.name]) return;
        const name = row[idx.name].trim();
        const qty = parseFloat(row[idx.qty])||0;
        const unit = (idx.unit>=0?row[idx.unit]:'kg').trim().toLowerCase()||'kg';
        const cost = idx.cost>=0 ? parseFloat(row[idx.cost])||0 : 0;
        const supplier = idx.supplier>=0 ? row[idx.supplier].trim() : '';
        if(qty<=0) return;
        const item = LIBRARY.find(i=>i.name.toLowerCase()===name.toLowerCase());
        if(!item){ unmatched.push(name); return; }
        const isPiece = item.costUnit==='piece'||item.costUnit==='unit'||item.costUnit==='roll';
        const stockQty = isPiece ? qty : (unit==='g'?qty:qty*1000);
        addInventoryStock(item.id, stockQty, `Goods received: ${qty}${unit} for ${cost}${supplier?' — '+supplier:''}`);
        if(!isPiece && cost>0){ const qtyKg = unit==='g'?qty/1000:qty; if(qtyKg>0) costOverrides[item.id] = cost/qtyKg; }
        received++;
      });
      resultEl.style.color = unmatched.length ? 'var(--apricot)' : 'var(--mint)';
      resultEl.innerHTML = `Received ${received} line${received!==1?'s':''}.${unmatched.length?` Not matched (no stock added): ${unmatched.join(', ')}`:''}`;
      renderAll();
    }catch(e){ resultEl.style.color='var(--warn)'; resultEl.textContent='Could not read file: '+e.message; }
  };
  reader.readAsText(file);
}

/* ================= MANUAL ADD STOCK — BY CATEGORY ================= */
// A direct entry point in the Inventory tab itself: pick a category, then an
// ingredient within it, then quantity/cost — rather than having to go find
// that ingredient in the Builder library first.
function openAddStockManualModal(){
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>Add stock — manual entry</h3>
    <div class="field-row">
      <div class="field"><label>Category</label><select id="asCategory" onchange="refreshAddStockIngredientOptions()">${CATEGORY_ORDER.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="field"><label>...or type a new category</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="asNewCatName" placeholder="e.g. Fillings" oninput="onAddStockNewCatInput()" style="flex:1;">
          <button class="btn ghost btn small" id="asCatOnlyBtn" onclick="confirmAddCategoryOnly()" disabled>Just add category</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field" id="asIngWrap"><label>Ingredient</label><select id="asIngredient" onchange="onAddStockIngredientChange()"></select></div>
      <div class="field"><label>...or type a new ingredient</label><input type="text" id="asNewIngName" placeholder="e.g. Dulce de Leche" oninput="onAddStockIngredientChange()"></div>
    </div>
    <p id="asNewIngNote" style="display:none;font-size:10.5px;color:var(--ink-soft);margin:-8px 0 12px;">New ingredient — nutrition defaults to 0, edit later via the ✎ icon in the Builder library. The quantity/cost below becomes its starting price.</p>
    <div class="field-row">
      <div class="field"><label>Quantity</label><input type="number" id="asQty" value="1" min="0.001" step="0.001"></div>
      <div class="field"><label>Unit</label><select id="asUnit"><option value="kg">kg</option><option value="g">g</option><option value="pcs">pcs</option></select></div>
      <div class="field"><label>Cost paid (optional)</label><input type="number" id="asCost" value="0" min="0" step="0.001"></div>
    </div>
    <div class="field"><label>Supplier (optional)</label><input type="text" list="supplierOptions" id="asSupplier"></div>
    <div id="asErr" class="err-text"></div>
    <div class="btn-row" style="display:flex;gap:8px;"><button class="btn primary" onclick="confirmAddStockManual()">Add to inventory</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>
  `;
  refreshAddStockIngredientOptions();
  document.getElementById('modalBackdrop').classList.add('open');
}
// Typing a new category name disables the existing-category dropdown (they're mutually exclusive)
// and immediately switches the ingredient side into "new ingredient" mode too, since a brand-new
// category can't have any existing ingredients to pick from.
function onAddStockNewCatInput(){
  const hasNewCat = document.getElementById('asNewCatName').value.trim().length>0;
  document.getElementById('asCategory').disabled = hasNewCat;
  document.getElementById('asCatOnlyBtn').disabled = !hasNewCat;
  // A new category doesn't force a new ingredient too — you can add the category alone,
  // or still add an ingredient/stock in the same step if you want to. Not coupled.
  if(!hasNewCat) refreshAddStockIngredientOptions();
  else document.getElementById('asIngWrap').style.display = 'none'; // no existing category selected to list from, but typing an ingredient name is still available below
}
function confirmAddCategoryOnly(){
  const newCatName = document.getElementById('asNewCatName').value.trim();
  if(!newCatName){ document.getElementById('asErr').textContent = 'Enter a name for the new category.'; return; }
  const existing = CATEGORY_ORDER.find(c=>c.toLowerCase()===newCatName.toLowerCase());
  if(existing){ document.getElementById('asErr').textContent = `"${existing}" already exists.`; return; }
  CATEGORY_ORDER.push(newCatName);
  closeModal();
  renderAll();
}
function refreshAddStockIngredientOptions(){
  document.getElementById('asIngWrap').style.display = 'flex';
  const cat = document.getElementById('asCategory').value;
  const items = LIBRARY.filter(i=>i.cat===cat).sort((a,b)=>a.name.localeCompare(b.name));
  const sel = document.getElementById('asIngredient');
  sel.innerHTML = items.length ? items.map(i=>`<option value="${i.id}">${i.name}</option>`).join('') : '<option value="">— none yet, type a new one on the right —</option>';
  document.getElementById('asNewIngName').value = '';
  onAddStockIngredientChange();
}
// Typing into "new ingredient" disables the dropdown — it's a plain either/or, no nested option to find.
function onAddStockIngredientChange(){
  const hasNewIng = document.getElementById('asNewIngName').value.trim().length>0;
  const sel = document.getElementById('asIngredient');
  sel.disabled = hasNewIng;
  document.getElementById('asNewIngNote').style.display = hasNewIng ? 'block' : 'none';
  if(!hasNewIng && sel.value){
    const chosen = getItem(sel.value);
    const unitSel = document.getElementById('asUnit');
    if(chosen && (chosen.costUnit==='piece'||chosen.costUnit==='unit'||chosen.costUnit==='roll')) unitSel.value = 'pcs';
  }
}
function confirmAddStockManual(){
  const newCatName = document.getElementById('asNewCatName').value.trim();
  const newIngName = document.getElementById('asNewIngName').value.trim();
  const catSelVal = document.getElementById('asCategory').value;
  const ingSelVal = document.getElementById('asIngredient').value;
  const qty = parseFloat(document.getElementById('asQty').value)||0;
  const unit = document.getElementById('asUnit').value;
  const cost = parseFloat(document.getElementById('asCost').value)||0;
  const supplier = document.getElementById('asSupplier').value.trim();
  if(qty<=0){ document.getElementById('asErr').textContent = 'Enter a quantity greater than 0.'; return; }

  let category = catSelVal;
  if(newCatName){
    const existing = CATEGORY_ORDER.find(c=>c.toLowerCase()===newCatName.toLowerCase());
    category = existing || newCatName;
    if(!existing) CATEGORY_ORDER.push(newCatName);
  }

  let id;
  if(newIngName){
    if(LIBRARY.some(i=>i.name.toLowerCase()===newIngName.toLowerCase())){ document.getElementById('asErr').textContent = 'An ingredient with that name already exists — clear the new-ingredient field and pick it from the dropdown instead.'; return; }
    id = 'custom_'+newIngName.toLowerCase().replace(/[^a-z0-9]+/g,'_')+'_'+Math.floor(Math.random()*999);
    const isPieceUnit = unit==='pcs';
    const newItem = {
      id, name:newIngName, cat:category, custom:true, vegan:true, allergens:[],
      kcal:0, fat:0, satFat:0, sugar:0, protein:0, carbs:0,
      note:'Added via Inventory quick-entry — nutrition defaults to 0, edit via ✎ if needed.',
    };
    if(isPieceUnit){
      newItem.costUnit = 'unit';
      newItem.costPerUnit = qty>0 ? cost/qty : 0;
      newItem.bulkUnitQty = qty; newItem.bulkCost = cost; newItem.bulkCurrency = 'KWD';
    } else {
      const qtyKg = unit==='g'?qty/1000:qty;
      newItem.costKg = qtyKg>0 ? cost/qtyKg : 0;
      newItem.bulkQty = qty; newItem.bulkUnit = unit; newItem.bulkCost = cost; newItem.bulkCurrency = 'KWD';
    }
    LIBRARY.push(newItem);
  } else {
    if(!ingSelVal){ document.getElementById('asErr').textContent = 'Pick an ingredient, or type a new one on the right.'; return; }
    id = ingSelVal;
  }

  const item = getItem(id);
  const isPiece = item.costUnit==='piece'||item.costUnit==='unit'||item.costUnit==='roll';
  const stockQty = isPiece ? qty : (unit==='g'?qty:qty*1000);
  addInventoryStock(id, stockQty, `Manual entry: ${qty}${unit==='pcs'?' pcs':unit}${cost>0?' for '+cost:''}${supplier?' — '+supplier:''}`);
  if(!newIngName && !isPiece && cost>0){ const qtyKg = unit==='g'?qty/1000:qty; if(qtyKg>0) costOverrides[id] = cost/qtyKg; }
  closeModal(); renderAll();
}

function openDeductRecipeModal(){
  if(recipe.length===0){ return; }
  const body = document.getElementById('modalBody');
  const lines = recipe.map(r=>{
    const item = getItem(r.id); if(!item) return null;
    const have = getInventoryQty(r.id);
    const short = have<r.g;
    return {item, need:r.g, have, short};
  }).filter(Boolean);
  body.innerHTML = `
    <h3>Log production — deduct from stock</h3>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:-8px;">Deducts every ingredient in the current recipe from inventory, as if you just produced this batch.</p>
    <table class="recipe-table" style="margin-bottom:12px;">
      <tr><th>Ingredient</th><th style="text-align:right;">Needed</th><th style="text-align:right;">In stock</th><th></th></tr>
      ${lines.map(l=>`<tr><td>${l.item.name}</td><td style="text-align:right;">${isPackagingItem(l.item)?l.need+' pcs':formatWeight(l.need)}</td><td style="text-align:right;">${isPackagingItem(l.item)?l.have+' pcs':formatWeight(l.have)}</td><td>${l.short?'<span class="allergen-flag">⚠ short</span>':''}</td></tr>`).join('')}
    </table>
    ${lines.some(l=>l.short)?'<div class="warn-box">Some ingredients don\'t have enough recorded stock — deducting will floor them at 0 rather than go negative.</div>':''}
    <div class="btn-row" style="display:flex;gap:8px;"><button class="btn primary" onclick="confirmDeductRecipe()">Confirm — deduct from stock</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function confirmDeductRecipe(){
  const name = document.getElementById('recipeName').value;
  recipe.forEach(r=>{ consumeInventoryStock(r.id, r.g, `Produced batch: ${name}`); });
  closeModal(); renderAll();
}

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderTabbar();
  if(activeTab==='builder'){ renderLibrary(); renderRecipeTable(); renderPreview(); }
  else if(activeTab==='costing'){ renderCostingEngine(); }
  else if(activeTab==='inventory'){ renderInventoryView(); }
  else { renderTestingView(); }
}
document.getElementById('unitWeightG').addEventListener('input', renderAll);
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.dot-menu-wrap') && openDotMenuId){ openDotMenuId=null; if(activeTab==='testing') renderTestingView(); }
});
loadTemplate('banana_cake');
</script>
