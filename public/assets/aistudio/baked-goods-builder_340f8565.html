<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>En Cuisine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6F7F9; --panel:#FFFFFF; --ink:#1A1D23; --ink-soft:#6B7280;
  --frost:#3452C4; --frost-dark:#26399A; --apricot:#B7791F; --mint:#16803D;
  --line:#E3E6EB; --chip:#EEF1F5; --warn:#DC2626; --additive:#6D5AAE;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.5;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);}
.brand{display:flex;align-items:baseline;gap:13px;}
.brand .mark{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--frost);border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;text-transform:uppercase;padding:0;}
.brand h1{font-family:'Inter',sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:-.01em;color:var(--ink);}
.brand-eyebrow{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);margin-bottom:0;}
.tpl-row{display:flex;gap:8px;}
.btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);}
.btn.ghost:hover{background:var(--chip);}
.btn.primary{background:var(--frost);border-color:var(--frost);color:#fff;}
.btn.primary:hover{background:var(--frost-dark);border-color:var(--frost-dark);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.app-shell{display:flex;min-height:calc(100vh - 57px);}
.app-content{flex:1;min-width:0;}
.tabbar{width:220px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);padding:12px 0;}
.tab{padding:9px 20px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-left:3px solid transparent;}
.tab:hover{color:var(--ink);background:var(--chip);}
.tab.active{color:var(--frost);font-weight:600;background:var(--chip);border-left-color:var(--frost);}

.layout{display:grid;grid-template-columns:340px 1fr 360px;min-height:calc(100vh - 100px);}
@media (max-width:1250px){.layout{grid-template-columns:1fr;}}

.library{border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:100vh;position:sticky;top:0;}
.library h4{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:16px 0 6px;display:flex;justify-content:space-between;align-items:center;}
.library h4:first-child{margin-top:0;}
.add-inline-link{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--frost);cursor:pointer;text-transform:none;letter-spacing:0;}
.searchbox{width:100%;border:1px solid var(--line);background:var(--panel);padding:9px 10px;font-family:inherit;font-size:13px;margin-bottom:10px;}
.cat-toggle{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.process-group-header{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--frost);background:var(--chip);margin:16px -16px 6px;padding:6px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.process-group-header:first-child{margin-top:0;border-top:none;}
.cat-chip{border:1px solid var(--line);background:var(--panel);padding:4px 9px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
.cat-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.lib-item{border:1px solid var(--line);background:var(--panel);padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.lib-item:hover{border-color:var(--frost);}
.lib-item .liname{font-weight:600;font-size:12px;cursor:pointer;}
.lib-item .limeta{font-size:9.5px;color:var(--ink-soft);}
.lib-item .e-code{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--additive);}
.lib-item .btns{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--frost);border:1px solid var(--frost);width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:var(--panel);}
.icon-btn.cost{color:var(--apricot);border-color:var(--apricot);font-size:10px;}
.allergen-flag{color:var(--warn);font-weight:700;font-size:9.5px;}
.custom-tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;background:var(--mint);color:#fff;padding:1px 5px;margin-left:4px;}

main.builder{padding:20px 26px;overflow-y:auto;max-height:100vh;}
.recipe-title-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.recipe-title-row input{font-family:'Inter',sans-serif;font-size:24px;font-weight:600;border:none;background:none;color:var(--ink);border-bottom:1px solid transparent;padding:2px 0;}
.recipe-title-row input:focus{outline:none;border-bottom:1px solid var(--frost);}
.servings-field{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
.servings-field input{width:50px;border:1px solid var(--line);padding:5px 6px;font-family:'IBM Plex Mono',monospace;}

table.recipe-table{width:100%;border-collapse:collapse;margin-bottom:8px;}
table.recipe-table th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink);}
table.recipe-table td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle;}
table.recipe-table tr.section-row td{background:var(--chip);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:5px 8px;}
.gram-input{width:66px;border:1px solid var(--line);padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;}
.cost-val{font-family:'IBM Plex Mono',monospace;color:var(--frost);font-weight:700;}
.ingredient-link{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;}
.ingredient-link:hover{color:var(--frost);text-decoration-color:var(--frost);}
.supplier-input{width:100%;min-width:120px;border:1px solid var(--line);background:var(--panel);padding:5px 6px;font-family:inherit;font-size:11.5px;}
.bp-val{font-family:'IBM Plex Mono',monospace;color:var(--frost);font-weight:700;}
.rm-btn{color:var(--warn);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:14px;}
.additive-row td{color:var(--additive);}
.empty-recipe{color:var(--ink-soft);font-style:italic;text-align:center;padding:30px 0;}

.batch-total{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:10px 8px;border-top:2px solid var(--ink);font-weight:700;margin-bottom:20px;}

.method-box{border:1px solid var(--line);background:var(--panel);padding:16px;margin-bottom:20px;}
.method-box h3{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 10px;}
.method-box textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--panel);padding:9px 10px;font-family:inherit;font-size:12.5px;resize:vertical;}

.save-bar{border:1px solid var(--frost);background:rgba(46,110,116,.06);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.save-bar p{margin:0;font-size:11.5px;color:var(--ink-soft);max-width:400px;}

.preview{border-left:1px solid var(--line);padding:20px;background:var(--panel);overflow-y:auto;max-height:100vh;position:sticky;top:0;}
.ticket-head{background:var(--chip);border:1px solid var(--line);border-radius:6px;margin-bottom:18px;padding:12px 14px;position:relative;}
.ticket-head .t-eyebrow{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);margin-bottom:3px;}
.ticket-head .t-name{font-family:'Inter',sans-serif;font-weight:700;font-size:15px;line-height:1.2;padding-right:70px;}
.ticket-head .t-code{position:absolute;top:12px;right:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 8px;}
.preview h3{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:18px 0 8px;}
.preview h3:first-child{margin-top:0;}
.card{border:1px solid var(--line);padding:12px 14px;}
.tc-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dotted var(--line);font-size:11.5px;}
.tc-row:last-child{border-bottom:none;}
.tc-row .k{color:var(--ink-soft);}
.tc-row .v{font-weight:700;text-align:right;}
.nutri-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.nutri-cell{padding:8px 10px;border-right:1px dotted var(--line);border-bottom:1px dotted var(--line);}
.nutri-cell:nth-child(2n){border-right:none;}
.nutri-cell .num{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:var(--frost);}
.nutri-cell .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
.additive-chip{display:inline-block;background:rgba(138,95,176,.12);border:1px solid var(--additive);color:var(--additive);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 7px;margin:2px 3px 0 0;}
.empty{color:var(--ink-soft);font-style:italic;font-size:11px;}
.src-note{font-size:10px;color:var(--ink-soft);font-style:italic;margin-top:10px;line-height:1.5;}

/* ---------- Saved recipes tab ---------- */
.testing-wrap{padding:22px 30px;}
.project-card{border:1px solid var(--line);background:var(--panel);margin-bottom:16px;}
.project-head{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);}
.project-head .pname{font-family:'Inter',sans-serif;font-size:18px;font-weight:600;}
.project-head .pmeta{font-size:11px;color:var(--ink-soft);}
.version-row{padding:12px 18px;border-bottom:1px dotted var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.version-row:last-child{border-bottom:none;}
.vlabel{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;}
.status-pill{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;margin-left:8px;}
.status-draft{background:#EFE7D6;color:var(--ink-soft);}
.status-testing{background:rgba(226,140,76,.2);color:var(--apricot);}
.status-approved{background:rgba(94,154,114,.2);color:var(--mint);}
.status-rejected{background:rgba(194,91,74,.2);color:var(--warn);}
.score-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--frost);color:#fff;padding:2px 8px;margin-left:6px;}
.vrationale{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.vtest-line{font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
.dot-menu-wrap{position:relative;}
.dot-btn{font-family:'IBM Plex Mono',monospace;font-size:16px;cursor:pointer;padding:2px 8px;color:var(--ink-soft);}
.dot-btn:hover{color:var(--ink);}
.dot-dropdown{display:none;position:absolute;right:0;top:26px;background:var(--panel);border:1px solid var(--ink);min-width:190px;z-index:20;}
.dot-dropdown.open{display:block;}
.dot-dropdown div{padding:9px 14px;font-size:11.5px;cursor:pointer;border-bottom:1px solid var(--line);}
.dot-dropdown div:last-child{border-bottom:none;}
.dot-dropdown div:hover{background:var(--chip);}

.modal-backdrop{position:fixed;inset:0;background:rgba(30,43,42,.5);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--ink);padding:26px;width:680px;max-width:92vw;max-height:88vh;overflow-y:auto;overflow-x:hidden;}
.modal h3{font-family:'Inter',sans-serif;font-size:19px;margin:0 0 14px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:140px;}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);padding:8px 9px;font-family:inherit;font-size:13px;}
.field textarea{min-height:60px;resize:vertical;}
.field-row{display:flex;gap:12px;flex-wrap:wrap;}
.field-row .field{flex:1;}
.warn-box{background:var(--chip);border-left:2px solid var(--apricot);padding:9px 12px;font-size:11.5px;margin-bottom:14px;}
.ai-lookup-bar{display:flex;gap:8px;margin-bottom:6px;}
.ai-lookup-bar input{flex:1;border:1px solid var(--line);background:var(--panel);padding:9px 10px;font-family:inherit;font-size:13px;}
.computed-cost-preview{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--frost);font-weight:700;padding:8px 0;}
.diff-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.diff-table td{padding:5px 0;border-bottom:1px dotted var(--line);}
.err-text{color:var(--warn);font-size:11.5px;margin-bottom:8px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">EC</span><div><div class="brand-eyebrow">Enhanced Cuisine</div><h1>En Cuisine</h1></div></div>
  <div class="tpl-row">
    <button class="btn ghost" onclick="loadTemplate('banana_cake')">Load Banana Cake template</button>
    <button class="btn ghost" onclick="resetRecipe()">Start blank</button>
    <input type="file" id="importRecipeFile" accept=".json" style="display:none" onchange="handleImportRecipeFile(event)">
    <button class="btn ghost" onclick="document.getElementById('importRecipeFile').click()">📂 Import recipe (JSON)</button>
    <button class="btn primary" onclick="openExportModal()">Export ▾</button>
  </div>
</div>

<div class="app-shell">
<div class="tabbar" id="tabbar"></div>
<div class="app-content">

<div id="builderView">
  <div class="layout">
    <div class="library">
      <input type="text" class="searchbox" id="searchBox" placeholder="Search ingredients (e.g. flour, sorbate, E160a)…" oninput="renderLibrary()">
      <div class="cat-toggle" id="catToggle"></div>
      <div id="libraryList"></div>
    </div>

    <main class="builder">
      <div class="recipe-title-row">
        <input type="text" id="recipeName" value="Banana Cake" oninput="renderPreview()">
        <div class="servings-field">Weight per piece <input type="number" id="unitWeightG" value="90" min="1" oninput="renderAll()"> g</div>
      </div>
      <table class="recipe-table" id="recipeTable"></table>
      <div class="batch-total" id="batchTotal"></div>

      <div class="method-box">
        <h3>Method / process notes</h3>
        <textarea id="methodNotes" placeholder="Mixing order, oven temp, bake time, cooling…">Cream sugar and oil. Add eggs one at a time. Fold in mashed banana. Sift dry ingredients separately, fold in gently. Pour into lined tin. Bake 175°C / 347°F for 45–50 min until skewer comes out clean.</textarea>
      </div>

      <div class="save-bar">
        <p>Save this formulation as a version under a recipe project — every save requires a short rationale so the iteration history stays meaningful.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="openViewRecipeModal()">📋 View recipe</button>
          <button class="btn primary" onclick="openSaveVersionModal()">💾 Save as version</button>
        </div>
      </div>
    </main>

    <aside class="preview" id="previewPanel"></aside>
  </div>
</div>

<div id="costingView" class="testing-wrap" style="display:none;"></div>

<div id="inventoryView" class="testing-wrap" style="display:none;"></div>

<div id="testingView" style="display:none;"></div>

</div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
<datalist id="supplierOptions">
  <option value="Americana">
  <option value="IFFCO">
  <option value="Al Kabeer">
  <option value="Rawabi">
  <option value="Local Market Supplier">
  <option value="Bulk Distributor A">
  <option value="Bulk Distributor B">
  <option value="Generic / Unspecified">
</datalist>

<script>
/* ================================================================

  {id:'oil_sunflower',name:'Sunflower Oil',cat:'Fats & Oils',vegan:true,allergens:[],costKg:2.3,kcal:884,fat:100,satFat:10.3,sugar:0,protein:0,carbs:0,note:'Neutral flavour, common default'},

  {id:'oil_vegblend',name:'Vegetable Oil Blend (mixed seed)',cat:'Fats & Oils',vegan:true,allergens:[],costKg:1.9,kcal:884,fat:100,satFat:12.0,sugar:0,protein:0,carbs:0,note:'Lowest cost, composition varies by supplier'},

/* ================= NUTRITION SEARCH ENGINE — LIVE API =================
   Calls Claude (with web search) directly for real nutrition data. Works
   inside the Claude artifact environment with no API key required — the
   platform authenticates the request. If the call fails for any reason
   (offline, rate-limited, run outside an artifact context) it falls back
   to the local reference database / category estimate below, so the
   search bar always returns something rather than breaking.
================================================================= */
function estimateByCategory(query){
  const q = query.toLowerCase();
  const rules = [
    {test:/flour/, profile:{kcal:360,fat:1.5,satFat:0.3,sugar:0.5,protein:10,carbs:75}, allergens:['gluten']},
    {test:/oil|fat|butter(?!milk)|ghee|margarine/, profile:{kcal:800,fat:88,satFat:30,sugar:1,protein:1,carbs:2}, allergens:[]},
    {test:/sugar|syrup|honey|nectar/, profile:{kcal:340,fat:0,satFat:0,sugar:75,protein:0.2,carbs:80}, allergens:[]},
    {test:/milk|cream|yogurt|dairy|cheese/, profile:{kcal:150,fat:8,satFat:5,sugar:5,protein:5,carbs:6}, allergens:['dairy']},
    {test:/nut|almond|walnut|hazelnut|pecan|cashew|pistachio/, profile:{kcal:600,fat:52,satFat:6,sugar:5,protein:18,carbs:20}, allergens:['tree nuts']},
    {test:/fruit|berry|banana|apple|mango|orange|lemon|fig/, profile:{kcal:60,fat:0.3,satFat:0.1,sugar:12,protein:0.8,carbs:15}, allergens:[]},
    {test:/spice|powder|extract|zest|essence/, profile:{kcal:250,fat:3,satFat:0.5,sugar:2,protein:6,carbs:60}, allergens:[]},
    {test:/egg/, profile:{kcal:143,fat:9.5,satFat:3.1,sugar:0.4,protein:12.6,carbs:0.7}, allergens:['egg']},
  ];
  for(const rule of rules){ if(rule.test.test(q)) return {...rule.profile, allergens:rule.allergens}; }
  return {kcal:300,fat:5,satFat:1,sugar:10,protein:8,carbs:55, allergens:[]}; // generic fallback
}
function searchNutritionLocal(query, reasonPrefix){
  const q = query.trim().toLowerCase();
  let match = NUTRITION_REFERENCE_DB.find(e=>e.name.toLowerCase()===q);
  if(!match) match = NUTRITION_REFERENCE_DB.find(e=>e.aliases.some(a=>a.toLowerCase()===q));
  if(!match) match = NUTRITION_REFERENCE_DB.find(e=>e.name.toLowerCase().includes(q)||q.includes(e.name.toLowerCase()));
  if(!match) match = NUTRITION_REFERENCE_DB.find(e=>e.aliases.some(a=>a.toLowerCase().includes(q)||q.includes(a.toLowerCase())));
  const prefix = reasonPrefix ? reasonPrefix+' — using local reference data instead. ' : '';
  if(match){
    return {name:match.name, kcal:match.kcal, fat:match.fat, satFat:match.satFat, sugar:match.sugar, protein:match.protein, carbs:match.carbs, allergens:match.allergens, vegan:match.vegan, source:'local_reference_database', confidence:'medium', note:`${prefix}Matched "${match.name}" in the local reference database.`};
  }
  const est = estimateByCategory(q);
  return {name:query, ...est, vegan:true, source:'local_estimate', confidence:'low', note:`${prefix}No exact match found — this is a category-based estimate, not real data. Review before saving.`};
}
async function searchNutritionAI(query){
  const q = query.trim();
  if(!q) return null;
  try{
    const prompt = `Search the web for real nutritional data on this food/baking ingredient: "${q}".
Return ONLY a single JSON object, no prose, no markdown code fences, matching exactly this shape:
{"name":"proper display name","kcal":number,"fat":number,"satFat":number,"sugar":number,"protein":number,"carbs":number,"allergens":["lowercase strings, empty array if none"],"vegan":boolean}
All nutrition values are per 100g, standard reference composition data. If you can't find an exact match, give your best-informed estimate but still return valid JSON in this exact shape — no other text.`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content:prompt}],
        tools:[{type:"web_search_20250305", name:"web_search"}],
      }),
    });
    if(!response.ok) throw new Error(`API returned ${response.status}`);
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text);
    const raw = textBlocks.join("\n");
    const clean = raw.replace(/```json|```/g,'').trim();
    const jsonMatch = clean.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error("Could not parse a data object from the response");
    const parsed = JSON.parse(jsonMatch[0]);
    return {
      name: parsed.name||q, kcal:parsed.kcal||0, fat:parsed.fat||0, satFat:parsed.satFat||0,
      sugar:parsed.sugar||0, protein:parsed.protein||0, carbs:parsed.carbs||0,
      allergens: parsed.allergens||[], vegan: !!parsed.vegan,
      source:'live_api', confidence:'high', note:`Live search via Claude + web search for "${q}".`,
    };
  } catch(err){
    return searchNutritionLocal(q, `Live search failed (${err.message})`);
  }
}

let recipe = [];

let activeCatFilter = null;
let costOverrides = {}; // id -> cost per KG (from bulk purchase entry)
// Inventory: id -> {qty (grams for weight/piece items, count for unit/roll items), history:[{date,type,qty,note}]}.
// Stock is added automatically whenever a bulk purchase is recorded on an ingredient — that's
// the "ingredient added -> saved in inventory" link — and can be manually adjusted or deducted
// when a batch is actually produced.
let inventory = {};
function ensureInventory(id){ if(!inventory[id]) inventory[id] = {qty:0, history:[]}; return inventory[id]; }
function addInventoryStock(id, qty, note){
  if(!qty || qty<=0) return;
  const inv = ensureInventory(id);
  inv.qty += qty;
  inv.history.push({date:new Date().toISOString(), type:'received', qty, note});
}
function consumeInventoryStock(id, qty, note){
  if(!qty || qty<=0) return;
  const inv = ensureInventory(id);
  inv.qty = Math.max(0, inv.qty-qty);
  inv.history.push({date:new Date().toISOString(), type:'consumed', qty, note});
}
function getInventoryQty(id){ return inventory[id] ? inventory[id].qty : 0; }
let activeTab = 'builder'; // builder | costing | testing

let projectCounter = 1;

function getItem(id){ return LIBRARY.find(i=>i.id===id); }
// Raw cost/kg exactly as purchased (from bulk entry or the library default) — no wastage applied.
function rawCostKg(item){ return costOverrides[item.id]!==undefined ? costOverrides[item.id] : item.costKg; }
// Effective cost/kg of the USABLE portion, after wastage (peel, core, trim). If you pay for
// 14kg of whole banana at 8 KWD (raw = 0.571/kg) and 40% is lost to peel, the edible flesh
// you actually get is 14 × 0.60 = 8.4kg — so the real cost per kg of edible banana is
// 8 ÷ 8.4 = 0.952/kg, not the raw 0.571/kg. Formula: raw ÷ (1 − wastage%).
// Recipe quantities represent edible/usable weight, so this adjusted figure is what
// feeds every cost calculation in the tool — the raw price stays visible separately.
function effectiveCostKg(item){
  const raw = rawCostKg(item);
  const wastage = item.wastagePct||0;
  if(wastage<=0) return raw;
  const factor = 1-(Math.min(wastage,99)/100);
  return factor>0 ? raw/factor : raw;
}
// Binds a recompute handler to both 'input' and 'change' — 'input' covers normal typing,
// 'change' catches paste-then-tab-away, autofill, and number-spinner clicks that don't
// always fire 'input' consistently across browsers. Without both, a value can look
// updated in the field but silently fail to recompute and get saved stale.
function bindRecompute(ids, fn){
  ids.forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', fn);
    el.addEventListener('change', fn);
  });
}
function isPackagingItem(item){ return item.cat==='Packing Materials'; }
// Cost per single unit (box, label, or one flow-wrapped pack) — used for items measured
// by count, not weight. 'roll' items derive it from roll specs; 'unit' items store it directly.
function effectiveCostPerUnit(item){
  if(costOverrides[item.id]!==undefined) return costOverrides[item.id];
  if(item.costUnit==='roll'){
    const packagesPerRoll = item.wrapLengthCmPerUnit>0 ? (item.rollLengthM*100)/item.wrapLengthCmPerUnit : 0;
    return packagesPerRoll>0 ? item.costPerRoll/packagesPerRoll : 0;
  }
  return item.costPerUnit||0;
}
// For weight-based-but-piece-bought items (eggs): price per piece, derived from cost/kg × avg piece weight.
function effectivePricePerPiece(item){
  if(item.costUnit!=='piece') return null;
  return effectiveCostKg(item)*((item.pieceWeightG||0)/1000);
}

function renderLibItem(i){
  const el = document.createElement('div'); el.className='lib-item';
  const allergenTxt = i.allergens&&i.allergens.length?`<span class="allergen-flag">⚠ ${i.allergens.join(', ')}</span>`:'';
  const ecodeTxt = i.ecode?`<span class="e-code">${i.ecode}</span> · `:'';
  let costTxt;
  if(isPackagingItem(i)){
    const perUnit = effectiveCostPerUnit(i);
    costTxt = `$${perUnit.toFixed(3)}/pack${costOverrides[i.id]!==undefined?' (custom)':''}${i.costUnit==='roll'?` (from roll: ${i.rollLengthM}m × ${i.rollWidthMM}mm, ${i.wrapLengthCmPerUnit}cm/pack)`:''}`;
  } else if(i.costUnit==='piece'){
    const perKg = effectiveCostKg(i);
    const perPc = effectivePricePerPiece(i);
    costTxt = `$${perKg.toFixed(2)}/kg <b>and</b> $${perPc.toFixed(3)}/pc (at ${i.pieceWeightG}g each)${costOverrides[i.id]!==undefined?' (custom)':''}`;
  } else {
    costTxt = `$${effectiveCostKg(i).toFixed(2)}/kg${i.wastagePct?` <span style="color:var(--warn);">(raw $${rawCostKg(i).toFixed(2)}, ${i.wastagePct}% loss)</span>`:''}${costOverrides[i.id]!==undefined?' (custom)':''}`;
  }
  el.innerHTML = `<div><div class="liname" onclick="addToRecipe('${i.id}')">${i.name}${i.custom?'<span class="custom-tag">CUSTOM</span>':''}</div><div class="limeta">${ecodeTxt}${isPackagingItem(i)?'':i.kcal+'kcal/100g · '}${costTxt}${allergenTxt?' · '+allergenTxt:''}</div></div>
    <div class="btns"><div class="icon-btn cost" title="Edit ingredient (nutrition, allergens, cost)" onclick="openIngredientEditModal('${i.id}')">✎</div><div class="icon-btn" title="Add to recipe" onclick="addToRecipe('${i.id}')">+</div></div>`;
  return el;
}
function addToRecipe(id){
  const item = getItem(id);
  if(!item) return;
  const existing = recipe.find(r=>r.id===id);
  const step = isPackagingItem(item) ? 1 : (item.ecode ? 1 : 50);
  if(existing){ existing.g += step; }
  else recipe.push({id, g: isPackagingItem(item) ? 1 : (item.ecode ? 2 : 0)});
  renderAll();
}
function removeFromRecipe(id){ recipe = recipe.filter(r=>r.id!==id); renderAll(); }
function parseWeightInput(val, currentG){
  let s = String(val).trim().toLowerCase();
  if(s.endsWith('kg')) return Math.max(0, parseFloat(s)*1000||0);
  if(s.endsWith('g')) return Math.max(0, parseFloat(s)||0);
  // Plain standard decimal, always denominated in kg — e.g. 0.25 = 250g, 6 = 6000g,
  // 0.06 = 60g. No special digit-reading rules: this is just kg × 1000, exactly like
  // any normal quantity field. Use an explicit "g" suffix (e.g. "60g") to type grams directly.
  return Math.max(0, (parseFloat(s)||0)*1000);
}
function updateGrams(id, val){
  const r = recipe.find(r=>r.id===id);
  if(r) r.g = parseWeightInput(val, r.g);
  renderAll();
}

    </div>
    <div class="computed-cost-preview" id="eiRollPreview"></div>
    <p style="font-size:10.5px;color:var(--ink-soft);margin:6px 0 12px;">Roll weight ≈ length × width × GSM ÷ 1,000,000 — useful if your supplier prices by weight instead of by roll; the packages-per-roll math only needs length and wrap-length-per-pack.</p>
    ` : `
    <p style="font-size:11px;color:var(--ink-soft);margin:0 0 6px;">Bulk purchase reference — e.g. 50 kg for 5 KWD. Saved with this ingredient so you can see what it was based on next time.</p>
    <div class="field-row">
      <div class="field"><label>Bulk quantity</label><input type="number" id="eiBulkQty" value="${item.bulkQty!==undefined?item.bulkQty:50}" min="0.001" step="0.001"></div>
      <div class="field"><label>Unit</label><select id="eiBulkUnit"><option value="kg" ${(!item.bulkUnit||item.bulkUnit==='kg')?'selected':''}>kg</option><option value="g" ${item.bulkUnit==='g'?'selected':''}>g</option></select></div>
      <div class="field"><label>Total cost paid</label><input type="number" id="eiBulkCost" value="${item.bulkCost!==undefined?item.bulkCost:(currentCost*50).toFixed(3)}" min="0" step="0.001"></div>
      <div class="field"><label>Currency</label><input type="text" id="eiCurrency" value="${item.bulkCurrency||'KWD'}"></div>
    </div>
    <p style="font-size:10.5px;color:var(--ink-soft);margin:-6px 0 12px;">Changing these recalculates the cost/kg field above automatically.</p>
    `}
    <div id="modalErr" class="err-text"></div>
    <div class="tc-row" style="border:1px solid var(--line);padding:8px 10px;margin-bottom:10px;"><span class="k">Current stock on hand</span><span class="v">${formatWeight ? (item.costUnit==='piece'||item.costUnit==='unit'||item.costUnit==='roll' ? getInventoryQty(id)+' pcs' : formatWeight(getInventoryQty(id))) : getInventoryQty(id)}</span></div>
    <div class="btn-row" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn primary" onclick="confirmIngredientEdit('${id}', false)">Save changes</button>
      <button class="btn primary" style="background:var(--mint);border-color:var(--mint);" onclick="confirmIngredientEdit('${id}', true)">📦 Save &amp; log stock received</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
  `;
  if(item.costUnit==='piece'){
    const recompute = ()=>{
      const pieces = parseFloat(document.getElementById('eiPieces').value)||0;
      const pieceW = parseFloat(document.getElementById('eiPieceWeight').value)||0;
      const cost = parseFloat(document.getElementById('eiBulkCost').value)||0;
      const totalKg = (pieces*pieceW)/1000;
      const perKg = totalKg>0 ? cost/totalKg : 0;
      const perPc = perKg*(pieceW/1000);
      document.getElementById('eiCostKg').value = perKg.toFixed(3);
      document.getElementById('eiPiecePreview').innerHTML = `= <b>${perKg.toFixed(3)} /kg</b> &nbsp;and&nbsp; <b>${perPc.toFixed(3)} /piece</b>`;
    };
    bindRecompute(['eiPieces','eiPieceWeight','eiBulkCost'], recompute);
    recompute();
  } else if(item.costUnit==='unit'){
    bindRecompute(['eiUnitQty','eiUnitCost'], ()=>{
      const qty = parseFloat(document.getElementById('eiUnitQty').value)||0;
      const cost = parseFloat(document.getElementById('eiUnitCost').value)||0;
      document.getElementById('eiCostUnit').value = (qty>0 ? cost/qty : 0).toFixed(3);
    });
  } else if(item.costUnit==='roll'){
    const recomputeRoll = ()=>{
      const lenM = parseFloat(document.getElementById('eiRollLength').value)||0;
      const wrapCm = parseFloat(document.getElementById('eiWrapLen').value)||0;
      const costRoll = parseFloat(document.getElementById('eiCostPerRoll').value)||0;
      const widthMM = parseFloat(document.getElementById('eiRollWidth').value)||0;
      const gsm = parseFloat(document.getElementById('eiGsm').value)||0;
      const packagesPerRoll = wrapCm>0 ? (lenM*100)/wrapCm : 0;
      const perPack = packagesPerRoll>0 ? costRoll/packagesPerRoll : 0;
      const rollWeightKg = (lenM*(widthMM/1000)*gsm)/1000;
      document.getElementById('eiRollPreview').innerHTML = `= <b>${Math.floor(packagesPerRoll)} packs/roll</b> → <b>${perPack.toFixed(4)} /pack</b> &nbsp;·&nbsp; est. roll weight ${rollWeightKg.toFixed(1)}kg`;
    };
    bindRecompute(['eiRollLength','eiRollWidth','eiGsm','eiCostPerRoll','eiWrapLen'], recomputeRoll);
    recomputeRoll();
  } else {
    bindRecompute(['eiBulkQty','eiBulkUnit','eiBulkCost'], ()=>{
      const qty = parseFloat(document.getElementById('eiBulkQty').value)||0;
      const unit = document.getElementById('eiBulkUnit').value;
      const cost = parseFloat(document.getElementById('eiBulkCost').value)||0;
      const qtyKg = unit==='kg'?qty:qty/1000;
      document.getElementById('eiCostKg').value = (qtyKg>0 ? cost/qtyKg : 0).toFixed(3);
      updateWastagePreview();
    });
  }
  if(document.getElementById('eiWastage')){
    bindRecompute(['eiCostKg','eiWastage'], updateWastagePreview);
    updateWastagePreview();
  }
  function updateWastagePreview(){
    const el = document.getElementById('eiWastagePreview'); if(!el) return;
    const raw = parseFloat(document.getElementById('eiCostKg').value)||0;
    const wastage = parseFloat(document.getElementById('eiWastage').value)||0;
    const factor = 1-(Math.min(wastage,99)/100);
    const effective = factor>0 ? raw/factor : raw;
    el.innerHTML = wastage>0
      ? `= <b>${effective.toFixed(3)} /kg effective</b> for recipe costing (raw ${raw.toFixed(3)}/kg ÷ ${(factor*100).toFixed(0)}% usable)`
      : `No wastage set — effective cost = raw cost (${raw.toFixed(3)} /kg)`;
  }
  document.getElementById('modalBackdrop').classList.add('open');
}

function confirmIngredientEdit(id, receiveStock){
  const item = getItem(id); if(!item) return;
  if(item.custom) item.name = document.getElementById('eiName').value.trim()||item.name;
  item.kcal = parseFloat(document.getElementById('eiKcal').value)||0;
  item.fat = parseFloat(document.getElementById('eiFat').value)||0;
  item.satFat = parseFloat(document.getElementById('eiSatFat').value)||0;
  item.sugar = parseFloat(document.getElementById('eiSugar').value)||0;
  item.protein = parseFloat(document.getElementById('eiProtein').value)||0;
  item.carbs = parseFloat(document.getElementById('eiCarbs').value)||0;
  item.vegan = document.getElementById('eiVegan').value==='true';
  item.allergens = document.getElementById('eiAllergens').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(item.costUnit==='piece'){
    costOverrides[id] = parseFloat(document.getElementById('eiCostKg').value)||0;
    item.bulkPieces = parseFloat(document.getElementById('eiPieces').value)||0;
    item.pieceWeightG = parseFloat(document.getElementById('eiPieceWeight').value)||item.pieceWeightG;
    item.bulkCost = parseFloat(document.getElementById('eiBulkCost').value)||0;
    item.bulkCurrency = document.getElementById('eiCurrency').value||'KWD';
  } else if(item.costUnit==='unit'){
    costOverrides[id] = parseFloat(document.getElementById('eiCostUnit').value)||0;
    item.bulkUnitQty = parseFloat(document.getElementById('eiUnitQty').value)||0;
    item.bulkCost = parseFloat(document.getElementById('eiUnitCost').value)||0;
    item.bulkCurrency = document.getElementById('eiCurrency').value||'KWD';
  } else if(item.costUnit==='roll'){
    item.rollLengthM = parseFloat(document.getElementById('eiRollLength').value)||item.rollLengthM;
    item.rollWidthMM = parseFloat(document.getElementById('eiRollWidth').value)||item.rollWidthMM;
    item.gsm = parseFloat(document.getElementById('eiGsm').value)||item.gsm;
    item.costPerRoll = parseFloat(document.getElementById('eiCostPerRoll').value)||item.costPerRoll;
    item.wrapLengthCmPerUnit = parseFloat(document.getElementById('eiWrapLen').value)||item.wrapLengthCmPerUnit;
    item.bulkCurrency = document.getElementById('eiCurrency').value||'KWD';
    delete costOverrides[id]; // always re-derive from roll specs unless a manual override is set elsewhere
  } else {
    costOverrides[id] = parseFloat(document.getElementById('eiCostKg').value)||0;
    item.bulkQty = parseFloat(document.getElementById('eiBulkQty').value)||0;
    item.bulkUnit = document.getElementById('eiBulkUnit').value;
    item.bulkCost = parseFloat(document.getElementById('eiBulkCost').value)||0;
    item.bulkCurrency = document.getElementById('eiCurrency').value||'KWD';
    if(document.getElementById('eiWastage')) item.wastagePct = parseFloat(document.getElementById('eiWastage').value)||0;
  }
  if(receiveStock){
    let qty=0, note='';
    if(item.costUnit==='piece'){ qty=item.bulkPieces; note=`Bulk purchase: ${item.bulkPieces} pcs for ${item.bulkCost} ${item.bulkCurrency}`; }
    else if(item.costUnit==='unit'){ qty=item.bulkUnitQty; note=`Bulk purchase: ${item.bulkUnitQty} units for ${item.bulkCost} ${item.bulkCurrency}`; }
    else if(item.costUnit==='roll'){ const perRoll = item.wrapLengthCmPerUnit>0 ? (item.rollLengthM*100)/item.wrapLengthCmPerUnit : 0; qty=Math.floor(perRoll); note=`1 roll purchased (~${Math.floor(perRoll)} packs) for ${item.costPerRoll} ${item.bulkCurrency}`; }
    else { const qtyKg = item.bulkUnit==='kg'?item.bulkQty:item.bulkQty/1000; qty=qtyKg*1000; note=`Bulk purchase: ${item.bulkQty}${item.bulkUnit} for ${item.bulkCost} ${item.bulkCurrency}`; }
    addInventoryStock(id, qty, note);
  }
  closeModal(); renderAll();
}

// Auto-formats a gram amount: under 1000g shown in grams, 1000g and over shown in kg
// (with the exact gram figure alongside for precision) — e.g. 50 -> "50 g", 1200 -> "1.20 kg (1200 g)".
function formatWeight(g){
  if(g>=1000) return `${(g/1000).toFixed(2)} kg <span style="color:var(--ink-soft);font-weight:400;">(${g.toFixed(0)} g)</span>`;
  return `${Number.isInteger(g)?g:g.toFixed(1)} g`;
}

// Every function here only READS state (recipe, projects) and triggers a file download.
// Nothing is cleared, reset, or mutated — saved recipes and the current builder stay exactly as they are.
function downloadBlob(content, mime, filename){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

/* ---- Master pricing database: ingredients + costs only, independent of any recipe ---- */
function serializeIngredientForBackup(item){
  const base = {
    id:item.id, name:item.name, cat:item.cat, custom:!!item.custom, costUnit:item.costUnit||'weight',
    vegan:item.vegan, allergens:item.allergens||[], wastagePct:item.wastagePct||0,
    kcal:item.kcal, fat:item.fat, satFat:item.satFat, sugar:item.sugar, protein:item.protein, carbs:item.carbs,
    bulkCurrency:item.bulkCurrency||'KWD',
  };
  if(item.costUnit==='piece'){
    return {...base, costKg:rawCostKg(item), pieceWeightG:item.pieceWeightG, bulkPieces:item.bulkPieces, bulkCost:item.bulkCost};
  }
  if(item.costUnit==='unit'){
    return {...base, costPerUnit:effectiveCostPerUnit(item), bulkUnitQty:item.bulkUnitQty, bulkCost:item.bulkCost};
  }
  if(item.costUnit==='roll'){
    return {...base, rollLengthM:item.rollLengthM, rollWidthMM:item.rollWidthMM, gsm:item.gsm, costPerRoll:item.costPerRoll, wrapLengthCmPerUnit:item.wrapLengthCmPerUnit};
  }
  return {...base, costKg:rawCostKg(item), bulkQty:item.bulkQty, bulkUnit:item.bulkUnit, bulkCost:item.bulkCost};
}
function exportMasterPricingJSON(){
  const data = { exportedAt:new Date().toISOString(), ingredientCount:LIBRARY.length, ingredients: LIBRARY.map(serializeIngredientForBackup) };
  downloadBlob(JSON.stringify(data, null, 2), 'application/json', 'master-pricing-database.json');
}
// Restores a serialized ingredient onto the live LIBRARY item (or creates a new one) —
// rewrites the item's own base fields directly and clears any stale session override,
// so the imported price becomes the new source of truth immediately.
function applyIngredientBackup(entry){
  let item = LIBRARY.find(i=>i.id===entry.id) || LIBRARY.find(i=>i.name.toLowerCase()===String(entry.name||'').toLowerCase());
  const isNew = !item;
  if(isNew){
    item = {id:entry.id||('custom_'+safeFileName(entry.name)+'_'+Math.floor(Math.random()*999)), name:entry.name, cat:CATEGORY_ORDER.includes(entry.cat)?entry.cat:'Salt & Misc', custom:true};
    LIBRARY.push(item);
  }
  item.vegan = !!entry.vegan; item.allergens = entry.allergens||[]; item.wastagePct = entry.wastagePct||0;
  item.kcal=entry.kcal||0; item.fat=entry.fat||0; item.satFat=entry.satFat||0; item.sugar=entry.sugar||0; item.protein=entry.protein||0; item.carbs=entry.carbs||0;
  item.costUnit = entry.costUnit==='weight' ? undefined : entry.costUnit;
  item.bulkCurrency = entry.bulkCurrency||'KWD';
  delete costOverrides[item.id]; // imported value becomes the new base price, not a layered override
  if(entry.costUnit==='piece'){ item.costKg=entry.costKg||0; item.pieceWeightG=entry.pieceWeightG||50; item.bulkPieces=entry.bulkPieces; item.bulkCost=entry.bulkCost; }
  else if(entry.costUnit==='unit'){ item.costPerUnit=entry.costPerUnit||0; item.bulkUnitQty=entry.bulkUnitQty; item.bulkCost=entry.bulkCost; }
  else if(entry.costUnit==='roll'){ item.rollLengthM=entry.rollLengthM; item.rollWidthMM=entry.rollWidthMM; item.gsm=entry.gsm; item.costPerRoll=entry.costPerRoll; item.wrapLengthCmPerUnit=entry.wrapLengthCmPerUnit; }
  else { item.costKg=entry.costKg||0; item.bulkQty=entry.bulkQty; item.bulkUnit=entry.bulkUnit; item.bulkCost=entry.bulkCost; }
  if(isNew){
    let qty=0, note='Added via pricing import';
    if(entry.costUnit==='piece') qty = entry.bulkPieces||0;
    else if(entry.costUnit==='unit') qty = entry.bulkUnitQty||0;
    else if(entry.costUnit==='roll') qty = 0; // roll stock isn't tracked in simple units here
    else qty = (entry.bulkUnit==='kg'?(entry.bulkQty||0):(entry.bulkQty||0)/1000)*1000;
    if(qty>0) addInventoryStock(item.id, qty, note);
  }
  return isNew;
}
function importMasterPricingData(parsed){
  const entries = Array.isArray(parsed) ? parsed : (parsed.ingredients||[]);
  let updated=0, added=0;
  entries.forEach(entry=>{ if(applyIngredientBackup(entry)) added++; else updated++; });
  return {updated, added};
}

function buildRecipeExportObject(snapshotArg){
  const snap = snapshotArg!==undefined ? snapshotArg : {
    name: document.getElementById('recipeName').value,
    unitWeightG: parseFloat(document.getElementById('unitWeightG').value)||1,
    methodNotes: document.getElementById('methodNotes').value,
    items: recipe,
  };
  const c = computeTotals(snap.items);
  const unitW = snap.unitWeightG||1;
  const estYield = c.totalG>0 ? Math.floor(c.totalG/unitW) : 0;
  return {
    name: snap.name,
    unitWeightG: unitW,
    methodNotes: snap.methodNotes,
    ingredients: snap.items.map(r=>{
      const item = getItem(r.id); if(!item) return null;
      const packaging = isPackagingItem(item);
      return {
        name: item.name,
        category: item.cat,
        quantity: r.g,
        quantityUnit: packaging ? 'pieces' : 'g',
        cost: packaging ? effectiveCostPerUnit(item)*r.g : (effectiveCostKg(item)/1000)*r.g,
        supplier: r.supplier||'',
        allergens: item.allergens||[],
      };
    }).filter(Boolean),
    totalFoodWeightG: c.totalG,
    estimatedYieldPieces: estYield,
    ingredientCost: c.cost,
    packagingCost: c.packagingCost,
    totalCost: c.cost+c.packagingCost,
    allergens: c.allergens,
    additives: c.additives.map(a=>({code:a.ecode, name:a.name})),
    exportedAt: new Date().toISOString(),
  };
}

/* ================= BULK RECIPE IMPORT — BASE + VARIANTS, ONE FILE =================
   CSV columns: Recipe, Code, BaseCode, Ingredient, Quantity, Unit, Supplier, PieceWeightG
   - Recipe: the recipe this row belongs to (repeat the same name across its ingredient rows)
   - Code: a short reusable tag for THIS recipe, set once, so later variants can reference it
     instead of retyping the full name — e.g. "B1" for "Ice Cream Base"
   - BaseCode: the Code (or, if you didn't bother assigning one, the exact Recipe name) of an
     already-defined recipe earlier in the same file, whose ingredients get pulled in first
   - Ingredient/Quantity/Unit/Supplier: a normal ingredient line, matched by name against the
     library — same matching rules as the goods-received CSV import
   Each resulting recipe is created as its own saved project, v1.0, with a rationale noting
   what base (if any) it was built from.
================================================================= */

    <div class="warn-box">If an ingredient's exact library name contains a comma — e.g. "Whole Eggs (fresh, ~50g each)" — wrap it in double quotes in the CSV, or that row's columns will shift and it won't match. The downloadable template shows the correct format.</div>

function handleBulkRecipeImport(event){
  const file = event.target.files[0]; if(!file) return;
  const resultEl = document.getElementById('bulkRecipeResult');
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const rows = parseCSVSimple(ev.target.result);
      const header = rows[0].map(h=>h.toLowerCase());
      const idx = {
        recipe: header.indexOf('recipe'), code: header.indexOf('code'), baseCode: header.indexOf('basecode'),
        ing: header.indexOf('ingredient'), qty: header.indexOf('quantity'), unit: header.indexOf('unit'),
        supplier: header.indexOf('supplier'), pieceW: header.indexOf('pieceweightg'),
      };
      if(idx.recipe<0){ resultEl.style.color='var(--warn)'; resultEl.textContent='CSV needs at least a "Recipe" column.'; return; }

      // Group rows by recipe name, preserving first-appearance order so a base is always
      // resolved before any variant that references it (as long as it appears earlier in the file).
      const order = []; const groups = {};
      rows.slice(1).forEach(row=>{
        const name = (row[idx.recipe]||'').trim(); if(!name) return;
        if(!groups[name]){ groups[name]=[]; order.push(name); }
        groups[name].push(row);
      });

      const resolvedByName = {}; const resolvedByCode = {};
      const created = []; const unmatchedIngredients = []; const missingBases = [];

      order.forEach(recipeName=>{
        const groupRows = groups[recipeName];
        const codeRow = groupRows.find(r=>idx.code>=0 && r[idx.code] && r[idx.code].trim());
        const code = codeRow ? codeRow[idx.code].trim() : null;
        const baseRow = groupRows.find(r=>idx.baseCode>=0 && r[idx.baseCode] && r[idx.baseCode].trim());
        const baseRef = baseRow ? baseRow[idx.baseCode].trim() : null;
        const pwRow = groupRows.find(r=>idx.pieceW>=0 && r[idx.pieceW] && r[idx.pieceW].trim());
        const unitWeightG = pwRow ? (parseFloat(pwRow[idx.pieceW])||90) : 90;

        let items = [];
        let baseName = null;
        if(baseRef){
          const base = resolvedByCode[baseRef] || resolvedByName[baseRef.toLowerCase()];
          if(base){ items = base.items.map(i=>({...i})); baseName = base.name; }
          else missingBases.push({recipe:recipeName, baseRef});
        }

        groupRows.forEach(row=>{
          const ingName = idx.ing>=0 ? (row[idx.ing]||'').trim() : '';
          if(!ingName) return;
          const qty = idx.qty>=0 ? parseFloat(row[idx.qty])||0 : 0;
          const unit = (idx.unit>=0 ? (row[idx.unit]||'g').trim().toLowerCase() : 'g')||'g';
          const supplier = idx.supplier>=0 ? (row[idx.supplier]||'').trim() : '';
          if(qty<=0) return;
          const item = LIBRARY.find(i=>i.name.toLowerCase()===ingName.toLowerCase());
          if(!item){ unmatchedIngredients.push({recipe:recipeName, ingredient:ingName}); return; }
          const isPackagingQty = item.costUnit==='unit'||item.costUnit==='roll';
          const g = isPackagingQty ? qty : (unit==='kg'?qty*1000:qty);
          const existing = items.find(i=>i.id===item.id);
          if(existing) existing.g += g;
          else items.push({id:item.id, g, supplier});
        });

        resolvedByName[recipeName.toLowerCase()] = {name:recipeName, items, unitWeightG};
        if(code) resolvedByCode[code] = {name:recipeName, items, unitWeightG};

        const project = {id:'P'+(projectCounter++), name:recipeName, versions:[]};
        const rationale = baseName ? `Bulk imported — built from base "${baseName}"` : (code ? `Bulk imported — base recipe (code ${code})` : 'Bulk imported');
        project.versions.push({
          id:project.id+'-v1', lineageId:project.id, parentId:null, label:'1.0',
          diffs:[], rationale, status:'draft', score:null, scoreNotes:'', bakeTest:null, createdAt:new Date().toISOString(),
          snapshot:{name:recipeName, unitWeightG, methodNotes:'', items},
        });
        projects.push(project);
        created.push(recipeName);
      });

      let msg = `Created ${created.length} recipe${created.length!==1?'s':''}: ${created.join(', ')}.`;
      if(missingBases.length) msg += ` Base not found for: ${missingBases.map(m=>`${m.recipe} (looked for "${m.baseRef}")`).join(', ')} — those recipes were created with only their own listed ingredients, no base merged in.`;
      if(unmatchedIngredients.length) msg += ` Ingredients not in library, skipped: ${unmatchedIngredients.map(u=>`${u.ingredient} (in ${u.recipe})`).join(', ')}.`;
      resultEl.style.color = (missingBases.length||unmatchedIngredients.length) ? 'var(--apricot)' : 'var(--mint)';
      resultEl.innerHTML = msg;
      renderAll();
    }catch(e){ resultEl.style.color='var(--warn)'; resultEl.textContent='Could not read file: '+e.message; }
  };
  reader.readAsText(file);
}

/* ================= COMPUTE ================= */
function computeTotals(items){
  const list = items || recipe;
  const foodList = list.filter(r=>getItem(r.id) && !isPackagingItem(getItem(r.id)));
  const packagingList = list.filter(r=>getItem(r.id) && isPackagingItem(getItem(r.id)));
  const flourItems = foodList.filter(r=>getItem(r.id).cat==='Flours');
  const flourTotalG = flourItems.reduce((s,r)=>s+r.g,0);
  const totalG = foodList.reduce((s,r)=>s+r.g,0);
  const acc = {kcal:0,fat:0,satFat:0,sugar:0,protein:0,carbs:0};
  let cost = 0;
  const allergenSet = new Set();
  const additives = [];
  foodList.forEach(r=>{
    const item = getItem(r.id); if(!item) return;
    const frac = r.g/100;
    acc.kcal += item.kcal*frac; acc.fat += item.fat*frac; acc.satFat += item.satFat*frac;
    acc.sugar += item.sugar*frac; acc.protein += item.protein*frac; acc.carbs += item.carbs*frac;
    cost += (effectiveCostKg(item)/1000)*r.g;
    (item.allergens||[]).forEach(a=>allergenSet.add(a));
    if(item.ecode) additives.push(item);
  });
  let packagingCost = 0;
  const packagingLines = [];
  packagingList.forEach(r=>{
    const item = getItem(r.id); if(!item) return;
    const unitCost = effectiveCostPerUnit(item);
    const lineCost = unitCost*r.g; // r.g holds unit COUNT for packaging items, not grams
    packagingCost += lineCost;
    packagingLines.push({name:item.name, qty:r.g, unitCost, lineCost});
  });
  return {flourTotalG, totalG, acc, cost, allergens:[...allergenSet], additives, packagingCost, packagingLines};
}

/* ================= RENDER RECIPE TABLE ================= */
function renderRecipeTable(){
  const table = document.getElementById('recipeTable');
  if(recipe.length===0){
    table.innerHTML = `<tr><td class="empty-recipe">No ingredients yet — click items in the library on the left, use "+ Add ingredient" under any section to enter one manually, or load the Banana Cake template above.</td></tr>`;
    document.getElementById('batchTotal').innerHTML = '';
    return;
  }
  const {flourTotalG, totalG, cost:totalCost, packagingCost} = computeTotals();
  let html = `<tr><th>Ingredient</th><th style="text-align:right;">Grams / Qty</th><th style="text-align:right;">Baker's %</th><th style="text-align:right;">% of batch</th><th style="text-align:right;">Cost</th><th>Brand / Supplier</th><th></th></tr>`;
  CATEGORY_ORDER.forEach(cat=>{
    const items = recipe.filter(r=>getItem(r.id) && getItem(r.id).cat===cat);
    if(items.length===0) return;
    const isPacking = cat==='Packing Materials';
    html += `<tr class="section-row"><td colspan="7">${cat}${isPacking?' — quantity is unit count, not grams':''}</td></tr>`;
    items.forEach(r=>{
      const item = getItem(r.id);
      const bp = flourTotalG>0 ? (r.g/flourTotalG*100) : 0;
      const pct = totalG>0 ? (r.g/totalG*100) : 0;
      const lineCost = isPacking ? effectiveCostPerUnit(item)*r.g : (effectiveCostKg(item)/1000)*r.g;
      html += `<tr class="${item.ecode?'additive-row':''}">
        <td><span class="ingredient-link" onclick="openIngredientEditModal('${r.id}')" title="Edit nutrition, allergens, and cost">${item.name}</span>${item.ecode?` <span class="e-code" style="font-family:'IBM Plex Mono',monospace;">(${item.ecode})</span>`:''}${item.custom?'<span class="custom-tag">CUSTOM</span>':''}</td>
        <td style="text-align:right;">${isPacking
          ? `<input type="number" class="gram-input" value="${r.g}" min="0" step="1" title="Units (packs/boxes/labels) used" onchange="updateGrams('${r.id}', this.value)">`
          : `<input type="text" inputmode="decimal" class="gram-input" value="${(r.g/1000).toFixed(2)}" title="Weight in kg, e.g. 0.25 = 250g. Or use an explicit suffix like 60g." onchange="updateGrams('${r.id}', this.value)">`}</td>
        <td style="text-align:right;" class="bp-val">${isPacking?'—':(item.cat==='Flours'?'100.0':bp.toFixed(1)+'%')}</td>
        <td style="text-align:right;">${isPacking?'—':pct.toFixed(1)+'%'}</td>
        <td style="text-align:right;" class="cost-val">${lineCost.toFixed(3)}</td>
        <td><input type="text" class="supplier-input" list="supplierOptions" placeholder="e.g. Americana, local supplier…" value="${r.supplier||''}" onchange="updateSupplier('${r.id}', this.value)"></td>
        <td style="text-align:center;"><span class="rm-btn" onclick="removeFromRecipe('${r.id}')">✕</span></td>
      </tr>`;
    });
  });
  table.innerHTML = html;
  const unitW = parseFloat(document.getElementById('unitWeightG').value)||1;
  const estYield = totalG>0 ? Math.floor(totalG/unitW) : 0;
  const grandTotal = totalCost+packagingCost;

function currentSnapshot(){
  return {
    name: document.getElementById('recipeName').value.trim()||'Untitled Recipe',
    unitWeightG: parseFloat(document.getElementById('unitWeightG').value)||1,
    items: JSON.parse(JSON.stringify(recipe)),
    methodNotes: document.getElementById('methodNotes').value,
  };
}
function diffSnapshots(a,b){
  const diffs = [];
  if(a.unitWeightG!==b.unitWeightG) diffs.push({field:'Weight per piece (g)', from:a.unitWeightG, to:b.unitWeightG});
  const aIds = a.items.map(i=>i.id), bIds = b.items.map(i=>i.id);
  b.items.filter(i=>!aIds.includes(i.id)).forEach(i=>diffs.push({field:'Ingredient added', from:'—', to:(getItem(i.id)?.name||i.id)+' ('+i.g+'g)'}));
  a.items.filter(i=>!bIds.includes(i.id)).forEach(i=>diffs.push({field:'Ingredient removed', from:(getItem(i.id)?.name||i.id), to:'—'}));
  b.items.forEach(bi=>{ const ai=a.items.find(x=>x.id===bi.id); if(ai && ai.g!==bi.g) diffs.push({field:(getItem(bi.id)?.name||bi.id)+' (g)', from:ai.g, to:bi.g}); });
  return diffs;
}

    rationale, snapshot, status:'draft', score:null, scoreNotes:'', bakeTest:null, createdAt:new Date().toISOString(),

/* ================= COSTING ENGINE ================= */
// Scales the CURRENT recipe (whatever ratios are in the Builder tab) up or down to a
// target batch weight, preserving every ingredient's proportion — then applies an
// editable bake-loss % to show theoretical vs. actual portions and cost per portion.
function computeCostingEngine(){
  const base = computeTotals(recipe);
  const targetG = costingState.targetBatchKg*1000;
  const scale = base.totalG>0 ? targetG/base.totalG : 0;
  const scaledLines = recipe.map(r=>{
    const item = getItem(r.id); if(!item) return null;
    if(isPackagingItem(item)){
      const scaledQty = r.g*scale; // packaging quantity scales with the same batch/portion factor
      const unitCost = effectiveCostPerUnit(item);
      return {id:r.id, name:item.name, cat:item.cat, packaging:true, originalG:r.g, scaledG:scaledQty, costPerKg:unitCost, lineCost:unitCost*scaledQty};
    }
    const scaledG = r.g*scale;
    return {id:r.id, name:item.name, cat:item.cat, packaging:false, originalG:r.g, scaledG, costPerKg:effectiveCostKg(item), lineCost:(effectiveCostKg(item)/1000)*scaledG};
  }).filter(Boolean);
  const totalBatchCost = scaledLines.reduce((s,l)=>s+l.lineCost,0);
  const costPerKgBatch = costingState.targetBatchKg>0 ? totalBatchCost/costingState.targetBatchKg : 0;

  const portionG = costingState.portionG||1;
  const theoreticalPortions = Math.floor(targetG/portionG);
  const lossWeightG = targetG*(costingState.lossPct/100);
  const netUsableG = targetG-lossWeightG;
  const actualPortions = Math.floor(netUsableG/portionG);
  const costPerPortionTheoretical = theoreticalPortions>0 ? totalBatchCost/theoreticalPortions : 0;
  const costPerPortionActual = actualPortions>0 ? totalBatchCost/actualPortions : 0;

  return {scale, scaledLines, targetG, totalBatchCost, costPerKgBatch, portionG, theoreticalPortions, lossWeightG, netUsableG, actualPortions, costPerPortionTheoretical, costPerPortionActual};
}

function updateCostingInput(field, val){
  costingState[field] = Math.max(0, parseFloat(val)||0);
  renderCostingEngine();
}

function renderCostingEngine(){
  const wrap = document.getElementById('costingView');
  if(recipe.length===0){
    wrap.innerHTML = `<div class="empty-recipe">No recipe loaded — go to the Builder tab and add ingredients (or load the Banana Cake template) before costing a batch.</div>`;
    return;
  }
  const c = computeCostingEngine();
  const recipeName = document.getElementById('recipeName').value;

  wrap.innerHTML = `
    <h3 style="font-family:'Inter',sans-serif;font-size:20px;margin:0 0 6px;">Costing Engine — ${recipeName}</h3>
    <p style="font-size:12px;color:var(--ink-soft);margin:0 0 18px;max-width:640px;">Scales your current recipe ratios up or down to any target batch size, then applies an editable cooking-loss % to show both the theoretical portion count (raw batch weight ÷ portion size) and the real one after loss — recalculates automatically whenever you edit ingredients in the Builder tab or change the numbers below.</p>

    <div class="field-row" style="margin-bottom:8px;max-width:640px;">
      <div class="field"><label>Target batch weight (kg)</label><input type="number" id="ceBatchKg" value="${costingState.targetBatchKg}" min="0.1" step="0.1" onchange="updateCostingInput('targetBatchKg', this.value)"></div>
      <div class="field"><label>Portion size (g)</label><input type="number" id="cePortionG" value="${costingState.portionG}" min="1" step="5" onchange="updateCostingInput('portionG', this.value)"></div>
      <div class="field"><label>Estimated cooking loss (%)</label><input type="number" id="ceLossPct" value="${costingState.lossPct}" min="0" max="60" step="0.5" onchange="updateCostingInput('lossPct', this.value)"></div>
    </div>
    <p style="font-size:10.5px;color:var(--ink-soft);margin:0 0 20px;max-width:640px;">This covers any raw-to-finished shrinkage — baking evaporation for bread/cake (typically 6–10%), or moisture/fat loss when the batch involves cooked meat: ground beef pan-fried ~25–30%, roasted/braised beef or pork ~30–35%, grilled chicken breast ~25–30% (poached ~15–20%), bacon ~45–50%, baked salmon ~18–20%. Use whichever range matches your actual process, or your own logged bake-test average once you have one.</p>

function inventoryUnitLabel(item){ return (item.costUnit==='piece'||item.costUnit==='unit'||item.costUnit==='roll') ? 'pcs' : 'weight'; }
function inventoryUnitCost(item){
  if(item.costUnit==='piece') return effectiveCostKg(item); // /kg, shown alongside per-piece separately
  if(item.costUnit==='unit'||item.costUnit==='roll') return effectiveCostPerUnit(item);
  return effectiveCostKg(item);
}
function inventoryValue(id){
  const item = getItem(id); if(!item) return 0;
  const qty = getInventoryQty(id);
  if(item.costUnit==='piece') return (effectiveCostKg(item)/1000)*qty; // qty stored in grams
  if(item.costUnit==='unit'||item.costUnit==='roll') return effectiveCostPerUnit(item)*qty; // qty stored as count
  return (effectiveCostKg(item)/1000)*qty; // qty stored in grams
}

function reorderLast(id){
  const item = getItem(id); if(!item || !hasLastPurchase(item)) return;
  let qty=0, note='';
  if(item.costUnit==='piece'){ qty=item.bulkPieces||0; note=`Reorder: ${qty} pcs for ${item.bulkCost||0} ${item.bulkCurrency||'KWD'} (repeat of last purchase)`; }
  else if(item.costUnit==='unit'){ qty=item.bulkUnitQty||0; note=`Reorder: ${qty} units for ${item.bulkCost||0} ${item.bulkCurrency||'KWD'} (repeat of last purchase)`; }
  else if(item.costUnit==='roll'){ const perRoll=Math.floor((item.rollLengthM*100)/item.wrapLengthCmPerUnit); qty=perRoll; note=`Reorder: 1 roll (~${perRoll} packs) for ${item.costPerRoll||0} ${item.bulkCurrency||'KWD'} (repeat of last purchase)`; }
  else { const qtyKg = item.bulkUnit==='g' ? (item.bulkQty||0)/1000 : (item.bulkQty||0); qty=qtyKg*1000; note=`Reorder: ${item.bulkQty}${item.bulkUnit} for ${item.bulkCost||0} ${item.bulkCurrency||'KWD'} (repeat of last purchase)`; }
